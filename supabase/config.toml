# Supabase local config for Jojan One.
# Full reference: https://supabase.com/docs/guides/local-development/cli/config
project_id = "jojanone"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match the production project's Postgres major version.
major_version = 17

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"

[studio]
enabled = true
port = 54323

[inbucket]
# Local email testing (captures verification / invite emails).
enabled = true
port = 54324

[storage]
enabled = true
# Global upload cap; per-bucket limits are set in migrations.
file_size_limit = "50MiB"

[auth]
enabled = true
# Local site URL; override per environment.
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true

# MFA (recommended for Owner/Admin — enforced in app policy).
[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[analytics]
enabled = false
